<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A320 Reset Guide</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #004d99;
            --danger: #dc3545;
            --bg: #f4f7f6;
            --text: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        #offline-banner {
            display: none;
            background-color: var(--danger);
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
        }
        header {
            background: var(--primary);
            color: white;
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #e0e0e0;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #fff;
            color: var(--primary);
        }
        #search {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        #container {
            padding: 15px;
            display: grid;
            gap: 15px;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .cb-highlight {
            background: #1a252f;
            color: #f1c40f;
            display: flex;
            justify-content: space-between;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
        }
        .critical-note {
            background: #ffebeb;
            color: var(--danger);
            padding: 12px;
            font-weight: bold;
            border-left: 5px solid var(--danger);
            margin: 10px;
        }
        .timer-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            margin: 0 10px 10px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .timer-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        .timer-btn.done {
            background: #28a745;
        }
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 15px;
            background: #fafafa;
            border-top: 1px solid #eee;
        }
        .detail-item {
            font-size: 12px;
            word-break: break-word;
        }
        .detail-item strong {
            color: var(--primary);
            display: block;
            margin-bottom: 3px;
        }
        
        /* تصميم القاطع الدائري */
        .cb-container {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: transparent; 
            padding: 5px;
        }
        .cb-red-collar {
            width: 55px; 
            height: 55px;
            background-color: #d32f2f;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.3);
        }
        .cb-black-center {
            width: 32px;
            height: 32px;
            background-color: #1a1a1a;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.6);
        }
        .cb-number {
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="offline-banner">⚠️ You are offline. Data might not be updated.</div>
    <header>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('classic', this)">Classic</button>
            <button class="tab-btn" onclick="switchTab('enhanced', this)">Enhanced</button>
        </div>
        <input type="text" id="search" placeholder="Search faults, CBs, panels..." oninput="renderCards()">
    </header>
    
    <div id="container"></div>

    <script src="./app.js"></script>
</body>
</html>
