<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A320 RESET</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        header { background: #1e293b; color: white; padding: 16px; text-align: center; position: sticky; top: 0; z-index: 100; font-weight: bold; font-size: 1.2rem; }
        .tabs { display: flex; background: #334155; }
        .tab-btn { flex: 1; padding: 12px; background: none; border: none; color: #94a3b8; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { color: white; border-bottom: 3px solid #3b82f6; background: #1e293b; }
        .search-container { padding: 12px 16px; background: white; border-bottom: 1px solid #e0e0e0; position: sticky; top: 98px; z-index: 99; }
        .search-container input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; }
        #app-container { padding: 16px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); padding-bottom: 80px; }
        .card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid #3b82f6; }
        .card.critical { border-left-color: #ef4444; background: #fef2f2; }
        .sys-title { font-size: 18px; font-weight: bold; color: #0f172a; margin: 0 0 8px 0; }
        .ecam-msg { color: #d97706; font-weight: bold; font-size: 15px; margin-bottom: 12px; }
        .cb-container { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
        .cb-box { background: #064e3b; color: white; padding: 6px 12px; border-radius: 6px; font-family: monospace; font-size: 14px; font-weight: bold; border: 1px solid #022c22; box-shadow: inset 0 2px 4px rgba(255,255,255,0.2); }
        .cb-label { font-size: 10px; color: #a7f3d0; display: block; margin-bottom: 2px; }
        .steps { background: #f8fafc; padding: 12px; border-radius: 8px; font-size: 14px; line-height: 1.5; color: #334155; border: 1px solid #e2e8f0; }
        .critical-note { margin-top: 10px; padding: 8px; background: #fee2e2; color: #991b1b; border-radius: 6px; font-size: 13px; font-weight: bold; border-left: 3px solid #ef4444; }
        .timer-btn { display: block; width: 100%; margin-top: 12px; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .timer-btn:disabled { cursor: not-allowed; opacity: 0.9; }
        .loader { text-align: center; padding: 20px; color: #64748b; font-weight: bold; }
    </style>
</head>
<body>
    <header>A320 RESET PROCEDURES</header>
   <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('classic', this)">Classic</button>
        <button class="tab-btn" onclick="switchTab('enhanced', this)">Enhanced</button>
    </div>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search ECAM, SYS, or CB...">
    </div>
    <div id="app-container">
        <div class="loader">Loading data...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
